[package]
name = "grantline"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Verify attenuated delegation mandates and authorize bounded agent actions"
license = "MIT"
repository = "https://github.com/nicholas-ruest/grantline"
keywords = ["authorization", "delegation", "agents", "policy", "cli"]
categories = ["command-line-utilities", "authentication"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
